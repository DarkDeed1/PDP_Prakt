{% extends 'crm/base.html' %}
{% block title %}Подтверждение удаления{% endblock %}
{% block page_title %}Подтверждение удаления{% endblock %}
{% block content %}
<section class="panel narrow-panel">
    <p>Вы действительно хотите удалить объект: {{ object }}?</p>
    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="javascript:history.back()" class="btn btn-secondary">Отмена</a>
    </form>
</section>
{% endblock %}
